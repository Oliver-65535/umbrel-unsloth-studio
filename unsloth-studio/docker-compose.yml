version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: oliver-unsloth-studio_unsloth_1
      APP_PORT: 8888
      PROXY_AUTH_ADD: "false"

  unsloth:
    image: unsloth/unsloth:latest
    environment:
      - OLLAMA_BASE_URL=http://ollama_ollama_1:11434
    volumes:
      - ${APP_DATA_DIR}/data:/root/.unsloth
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: on-failure