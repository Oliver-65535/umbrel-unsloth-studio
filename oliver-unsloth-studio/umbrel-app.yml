manifestVersion: 1
id: oliver-unsloth-studio
storage:
  dataRoot: data
name: Unsloth Studio
icon: https://raw.githubusercontent.com/Oliver-65535/umbrel-unsloth-studio/main/oliver-unsloth-studio/icon.svg
tagline: Fine-tune and train LLMs locally and faster with Unsloth
category: ai
version: "1.2.2"
port: 8888
description: >-
  Unsloth Studio allows you to train and fine-tune advanced AI models directly on your own hardware. 
  Self-hosting your development environment ensures full control over your data and protects your privacy.


  ⚠️ Before running a training job, make sure your device has enough free VRAM/RAM to support it. 
  Attempting to run a model that exceeds your available memory could cause your device to crash.


  **Advanced Setup:**

  If you want to connect Unsloth Studio to other apps or devices, here's how:
    - Apps running on UmbrelOS: Use oliver-unsloth-studio_app_1 as the host and 8888 as the port.
    - Custom Integrations: Connect to your container using your UmbrelOS local domain (e.g., http://umbrel.local:8888).
backupIgnore:
  - data/*
developer: Unsloth
website: https://unsloth.ai
submitter: Oliver-65535
repo: https://github.com
support: https://github.com/issues
gallery: []
defaultUsername: "unsloth"
deterministicPassword: true
dependencies: []
permissions:
  - GPU
releaseNotes: >-
  Umbrel now shows the initial admin password (deterministicPassword) after install; first-run login is seeded automatically.
path: ""