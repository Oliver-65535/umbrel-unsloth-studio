services:
  app_proxy:
    environment:
      APP_HOST: oliver-cherry-studio_cherry-studio_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  cherry-studio:
    image: ghcr.io/linuxserver/baseimage-kasmvnc:ubuntunoble@sha256:c6d902c207d6e4a66ca41ce36dda549cd58a5bc8d353468b24b0cf780eb528c8
    environment:
      - TITLE=Cherry Studio
      - NO_DECOR=1
      - START_DOCKER=false
      - DISABLE_IPV6=true
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data:/config
      - ${APP_DATA_DIR}/init:/custom-cont-init.d:ro
      - ${UMBREL_ROOT}/data/storage/downloads:/media/Downloads
      - /home/umbrel/Documents:/media/Documents
      - ${UMBREL_ROOT}/shared/Data:/media/Data
    restart: on-failure
